<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MG film</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #06080b; color: #eef4f8; font: 500 14px/1.4 system-ui, sans-serif; }
      body { display: grid; place-items: center; gap: 0; }
      #stage { width: 100vw; height: 100vh; display: grid; place-items: center; }
      canvas#screen { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; background: #000; }
      #status { position: fixed; left: 12px; bottom: 10px; font: 600 13px/1.3 Consolas, monospace; color: #7f8f9c; }
      #help { position: fixed; right: 12px; bottom: 10px; color: #46545f; font: 500 12px/1.4 system-ui; }
      body[data-mode="export"] #status, body[data-mode="export"] #help { display: none; }
      body[data-mode="export"] #stage { width: auto; height: auto; }
      body[data-mode="export"] canvas#screen { max-width: none; max-height: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="screen"></canvas></div>
    <div id="status">booting…</div>
    <div id="help">space play · ←/→ seek 1s (shift 5s) · [ ] prev/next shot · ?t=12.3 jump · ?render=1 export</div>
    <script type="module" src="./kit/player.js"></script>
  </body>
</html>
